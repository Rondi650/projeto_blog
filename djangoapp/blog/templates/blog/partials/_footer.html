<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.62.2/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.62.2/mode/javascript/javascript.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.62.2/mode/css/css.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.62.2/mode/htmlmixed/htmlmixed.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.62.2/mode/dockerfile/dockerfile.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.62.2/mode/nginx/nginx.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.62.2/mode/properties/properties.min.js"></script>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    if (typeof CodeMirror == 'undefined') {
      console.error('CodeMirror not loaded');
      return;
    }
    
    const codes = document.querySelectorAll('pre[data-language]');
    console.log('Found code blocks:', codes.length);
    
    for (const code of codes) {
      const language = code.dataset.language || null;
      const text = code.textContent || code.innerText;
      
      // Mapear nomes de linguagens comuns para os modos do CodeMirror
      const modeMap = {
        'yml': 'yaml',
        'dockerfile': 'dockerfile',
        'bash': 'shell',
        'sh': 'shell',
        'shell': 'shell',
        'promql': 'text', // PromQL não tem modo específico no CodeMirror 5
        'sql': 'sql',
        'python': 'python',
        'javascript': 'javascript',
        'js': 'javascript',
        'html': 'htmlmixed',
        'css': 'css',
        'xml': 'xml',
        'nginx': 'nginx',
        'ini': 'properties',
        'conf': 'properties'
      };
      
      const mode = modeMap[language] || language || 'text';
      
      const config = {
        value: text,
        tabSize: 2,
        mode: mode,
        theme: 'dracula',
        lineNumbers: true,
        readOnly: true,
        viewportMargin: 50,
        matchBrackets: true,
      };
      
      try {
        const editor = CodeMirror(function (node) {
          code.parentNode.replaceChild(node, code);
        }, config);
      } catch (e) {
        console.error('Error initializing CodeMirror for', language, e);
      }
    }
  });
</script>
