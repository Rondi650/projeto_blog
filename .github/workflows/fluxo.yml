name: Testes

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: open
          POSTGRES_USER: rondi
          POSTGRES_PASSWORD: rondi
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r djangoapp/requirements.txt

      - name: Criar .env para CI
        run: |
          cat > .env << 'EOF'
          SECRET_KEY=ci-test-key-not-secure
          DEBUG=1
          ALLOWED_HOSTS=127.0.0.1, localhost
          POSTGRES_DB=open
          POSTGRES_USER=rondi
          POSTGRES_PASSWORD=rondi
          POSTGRES_HOST=localhost
          POSTGRES_PORT=5432
          EOF

      - name: Rodar migrations
        run: python djangoapp/manage.py migrate

      - name: Rodar testes com pytest
        run: |
          cd djangoapp
          python -m pytest
